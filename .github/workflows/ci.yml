name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: build (windows-11-arm, aarch64-pc-windows-msvc)
    # Free for public repositories only. The job fails on private repos.
    runs-on: windows-11-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      TARGET: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Assert native ARM64 runner
        run: |
          "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw "Expected an ARM64 runner" }

      - name: Install rustup if the image lacks it
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile "$env:RUNNER_TEMP\rustup-init.exe"
            & "$env:RUNNER_TEMP\rustup-init.exe" -y --profile minimal --default-toolchain none
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      - name: Install pinned toolchain
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --component rustfmt,clippy --target $env:TARGET
          rustc -vV

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-arm64-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --target $env:TARGET -- -D warnings

      - name: Test
        run: cargo test --workspace --target $env:TARGET

      - name: Build release
        run: cargo build --workspace --release --target $env:TARGET

      - name: Verify PE machine type is 0xAA64
        run: ./scripts/check-pe-arm64.ps1 "target/$env:TARGET/release/armux.exe"

      - name: Smoke run
        run: |
          & "target/$env:TARGET/release/armux.exe" --version
          if ($LASTEXITCODE) { throw "armux.exe exited $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: armux-aarch64-pc-windows-msvc
          path: target/aarch64-pc-windows-msvc/release/armux.exe
          if-no-files-found: error
          retention-days: 14
