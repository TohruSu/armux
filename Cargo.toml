[workspace]
resolver = "3"
members = ["crates/armux"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/apaslam09/armux"
rust-version = "1.96"

[profile.release]
# Smaller binaries map fewer pages, which keeps working set down.
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
